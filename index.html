<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="SniperNest — משחק צלפים עם מצלמת כדור ורנטגן. AppNest.">
<meta property="og:title" content="SniperNest · AppNest">
<meta property="og:description" content="צלף. כוונת. כדור אחד.">
<meta property="og:image" content="icon-512.png">
<title>SniperNest</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b0b0d;--card:#141418;--card2:#1b1b21;--gold:#d4af37;--gold2:#f0d77a;--txt:#f3efe4;--mut:#9a958a;--red:#e04545;--ok:#4fc47a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(6,6,8,.35),rgba(6,6,8,.88) 60%);touch-action:pan-y}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:720px}
.logo{margin:6px 0 2px;text-align:center}
.logo h1{margin:0;font-size:clamp(30px,6vw,46px);letter-spacing:4px;font-weight:900;color:var(--gold);text-shadow:0 2px 18px rgba(212,175,55,.35)}
.logo h1 span{color:var(--txt)}
.logo p{margin:2px 0 0;color:var(--mut);font-size:14px}
.proto{display:inline-block;margin-top:6px;font-size:11px;border:1px solid var(--gold);color:var(--gold2);border-radius:20px;padding:2px 10px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{position:relative;text-align:start;background:rgba(20,20,24,.86);border:1px solid rgba(212,175,55,.55);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;transition:transform .12s,border-color .12s}
.mode:active{transform:scale(.98);border-color:var(--gold2)}
.mode .ic{font-size:40px;line-height:1}
.mode b{display:block;font-size:19px;color:var(--gold2)}
.mode small{display:block;color:var(--txt);opacity:.85;font-size:13px;margin-top:3px;line-height:1.35}
.mode em{display:block;font-style:normal;color:var(--mut);font-size:12px;margin-top:6px}
.homebar{display:flex;gap:10px;justify-content:center;margin-top:4px}
.btn{background:transparent;border:1px solid var(--gold);color:var(--gold2);border-radius:12px;padding:11px 18px;font-weight:600;min-height:44px}
.btn.solid{background:var(--gold);color:#16130a;border-color:var(--gold)}
.btn.danger{border-color:var(--red);color:#ff8a8a}
.btn:active{transform:scale(.97)}
.badge{margin-top:14px;text-align:center;color:var(--mut);font-size:11px}
.badge b{color:var(--gold)}
.head{display:flex;align-items:center;gap:10px;width:100%;max-width:720px;margin-bottom:10px}
.head h2{margin:0;font-size:20px;color:var(--gold2)}
.bk{background:transparent;border:1px solid var(--gold);color:var(--gold2);border-radius:12px;padding:8px 14px;font-weight:700;min-height:42px}
.set{background:rgba(20,20,24,.9);border:1px solid rgba(212,175,55,.25);border-radius:14px;padding:12px;margin-bottom:10px}
.set label{display:block;font-weight:700;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:40px;background:var(--card2);border:1px solid #333;border-radius:10px;padding:8px 10px;font-size:14px}
.seg button.on{background:var(--gold);color:#16130a;border-color:var(--gold);font-weight:700}
.note{margin:8px 0 0;color:var(--mut);font-size:12px;line-height:1.4}
.set input{width:100%;min-height:42px;background:var(--card2);border:1px solid #333;border-radius:10px;color:var(--txt);padding:8px 10px;font-size:15px}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .btn{flex:1}
.info{background:rgba(20,20,24,.9);border:1px solid rgba(212,175,55,.25);border-radius:14px;padding:6px 12px;margin-bottom:12px}
.info div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #26262c}.info div:last-child{border:0}
.info span{color:var(--mut)}
.links{display:grid;gap:8px;margin-bottom:12px}
.links a,.links button{display:block;text-align:center;text-decoration:none;background:transparent;border:1px solid var(--gold);color:var(--gold2);border-radius:12px;padding:11px;font-weight:600}
.disc{color:var(--mut);font-size:12px;line-height:1.5;text-align:center}
.aboutLogo{text-align:center;margin:4px 0 10px}.aboutLogo div{font-size:44px}.aboutLogo b{display:block;color:var(--gold2);font-size:22px}

/* HUD */
#hud{position:fixed;inset:0;display:none;pointer-events:none;direction:ltr}
#hud.on{display:block}
#hud .top{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(8,8,10,.72);border:1px solid rgba(212,175,55,.45);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--txt);min-height:36px;display:flex;align-items:center;gap:6px}
.pill small{color:var(--gold2);font-weight:700;font-size:12px}
.pill .k{color:var(--mut);font-weight:600;font-size:11px}
#bPause{pointer-events:auto;width:42px;justify-content:center;font-size:16px}
#tgts i{font-style:normal;color:#ff4040;margin:0 2px}#tgts i.dead{color:var(--mut)}#tgts i.run{color:#ffb020;animation:blink .6s infinite}#tgts i.gone{color:#ffb020}
@keyframes blink{50%{opacity:.3}}
#ammo{color:var(--gold2);letter-spacing:-1px}
.rb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(212,175,55,.8);background:rgba(10,10,12,.62);color:var(--txt);display:flex;align-items:center;justify-content:center;font-weight:800;touch-action:none}
#bFire{right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:92px;height:92px;font-size:20px;background:radial-gradient(circle,rgba(200,40,40,.85),rgba(120,15,15,.85));border-color:#ff8a7a;--p:1}
#bFire.cool{background:conic-gradient(rgba(200,40,40,.85) calc(var(--p)*360deg),rgba(40,40,40,.85) 0)}
#bFire:active{transform:scale(.94)}
#bScope{right:max(126px,calc(env(safe-area-inset-right) + 126px));bottom:max(30px,env(safe-area-inset-bottom));width:66px;height:66px;font-size:28px}
#bBreath{left:max(18px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:84px;height:84px;font-size:13px;flex-direction:column;gap:2px}
#bBreath.hold{background:rgba(80,160,255,.45);border-color:#9fd0ff}
#bBreath .bar{width:54px;height:6px;border-radius:3px;background:#333;overflow:hidden}
#breathBar{height:100%;background:#7fc4ff;width:100%}#breathBar.ex{background:#ff6a4a}
#zoomBox{position:absolute;right:max(16px,env(safe-area-inset-right));top:50%;transform:translateY(-62%);display:none;flex-direction:column;align-items:center;gap:6px;pointer-events:auto}
#hud.scoped #zoomBox{display:flex}
#zTrack{position:relative;width:46px;height:min(42vh,220px);touch-action:none}
#zTrack:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%);background:rgba(255,255,255,.18);border:1px solid rgba(212,175,55,.6);border-radius:3px}
#zThumb{position:absolute;left:50%;width:34px;height:28px;transform:translateX(-50%);background:var(--gold);border-radius:8px;box-shadow:0 2px 6px #000}
#zLbl{font-weight:800;color:var(--gold2);font-size:14px;text-shadow:0 1px 3px #000}
#rangeBox{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none}
#hud.scoped #rangeBox{display:flex}
#hud.kc .rb,#hud.kc .top,#hud.kc #zoomBox,#hud.kc #rangeBox{display:none}
#kcbar{position:fixed;left:0;right:0;top:0;display:none;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);pointer-events:none;font-weight:800;letter-spacing:2px;color:var(--gold2);direction:ltr}
#kcbar.on{display:flex}
#kcbar small{color:var(--mut);letter-spacing:0;font-weight:600}
#kcbar:after{content:"";position:fixed;left:0;right:0;bottom:0;height:9vh;background:#000}
#kcbar:before{content:"";position:fixed;left:0;right:0;top:0;height:9vh;background:#000;z-index:-1}
#xtint{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,rgba(20,60,90,.0) 30%,rgba(2,14,26,.75) 100%),repeating-linear-gradient(0deg,rgba(120,220,255,.05) 0 2px,transparent 2px 4px);mix-blend-mode:normal}
#xtint.on{opacity:1}
#xtint.on:after{content:attr(data-l);position:absolute;right:16px;bottom:12vh;color:#9fe6ff;font-weight:900;letter-spacing:4px;font-size:16px;text-shadow:0 0 8px #3cf}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#flash.on{animation:fl .18s ease-out}
@keyframes fl{0%{opacity:.55}100%{opacity:0}}
#msg{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0}
#msg.on{animation:pop 2.6s ease forwards}
#msgA{font-size:clamp(22px,5vw,34px);font-weight:900;color:var(--gold2);text-shadow:0 2px 8px #000,0 0 18px rgba(212,175,55,.5)}
#msgB{font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}18%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);background:rgba(10,10,12,.92);border:1px solid var(--gold);color:var(--txt);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:86vw;text-align:center}
#toast.on{opacity:1}
#rotHint{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:rgba(10,10,12,.85);border:1px solid rgba(212,175,55,.5);border-radius:10px;padding:6px 12px;font-size:12px;display:none;pointer-events:none}
#rotHint.on{display:block}
/* overlays */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:30;padding:16px;touch-action:pan-y}
.ov.on{display:flex;animation:fade .2s}
.card{width:100%;max-width:460px;max-height:92vh;overflow-y:auto;background:var(--card);border:1px solid rgba(212,175,55,.6);border-radius:18px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.card h3{margin:0 0 8px;color:var(--gold2);font-size:20px}
.card p{margin:0 0 10px;line-height:1.5;font-size:15px}
.card .tip{color:var(--mut);font-size:13px}
.card .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.card .btns .btn{flex:1}
.vlist{display:grid;gap:10px}
#resTitle{font-size:24px;text-align:center}#resTitle.ok{color:var(--ok)}#resTitle.bad{color:var(--red)}
#resReason{text-align:center;color:var(--mut)}
#resStars{text-align:center;font-size:34px;color:var(--gold);letter-spacing:6px}
#resStats div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #26262c}
#resStats span{color:var(--mut)}
#resBest{text-align:center;color:var(--gold2);font-weight:800;margin-top:6px}
.gIcon{font-size:52px;text-align:center}
#gDots{display:flex;gap:6px;justify-content:center;margin:6px 0}
#gDots i{width:8px;height:8px;border-radius:50%;background:#444}#gDots i.on{background:var(--gold)}
@media (max-height:440px){.logo h1{font-size:30px}.modes{margin:8px 0}.mode{padding:10px}.mode .ic{font-size:30px}#bFire{width:80px;height:80px}#bBreath{width:72px;height:72px}#bScope{width:58px;height:58px;right:112px}}

#loading{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#1a1a20,#050506);z-index:60}
#loading.on{display:flex}
#loading h1{margin:0;font-size:38px;letter-spacing:4px;color:var(--gold);font-weight:900}#loading h1 span{color:var(--txt)}
#loading .lb{width:min(70vw,320px);height:8px;border-radius:4px;background:#222;border:1px solid rgba(212,175,55,.5);overflow:hidden}
#loadBar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .2s}
#loadTxt{color:var(--mut);font-size:13px}
.modes{grid-template-columns:1fr 1fr}
@media (max-width:760px){.modes{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.cash{display:inline-flex;align-items:center;gap:6px;background:rgba(20,20,24,.85);border:1px solid var(--gold);border-radius:20px;padding:4px 12px;color:var(--gold2);font-weight:800;margin-top:6px}
#shopTabs{display:flex;gap:8px;margin-bottom:10px}#shopTabs button{flex:1;min-height:42px;border-radius:12px;background:var(--card2);border:1px solid #333;font-weight:700}#shopTabs button.on{background:var(--gold);color:#16130a;border-color:var(--gold)}
.item{display:flex;gap:12px;align-items:center;background:rgba(20,20,24,.92);border:1px solid rgba(212,175,55,.25);border-radius:14px;padding:10px;margin-bottom:10px}
.item.sel{border-color:var(--gold)}
.item img{width:120px;height:56px;object-fit:contain;flex:none;background:radial-gradient(#2a2a32,#141418);border-radius:10px}
.item .emo{width:120px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;font-size:32px;background:radial-gradient(#2a2a32,#141418);border-radius:10px}
.item .inf{flex:1;min-width:0}.item .inf b{color:var(--gold2);font-size:16px}.item .inf small{display:block;color:var(--txt);opacity:.8;font-size:12px;line-height:1.35;margin-top:2px}
.item .act{flex:none}.item .act .btn{padding:8px 12px;min-height:40px;font-size:14px}
.tag{display:inline-block;padding:6px 10px;border-radius:10px;background:rgba(79,196,122,.15);color:var(--ok);font-weight:700;font-size:13px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;margin-top:6px;font-size:11px;color:var(--mut)}
.bar{height:6px;border-radius:3px;background:#2a2a30;overflow:hidden;display:block}.bar i{display:block;height:100%;background:var(--gold)}
@media (max-width:520px){.item{flex-wrap:wrap}.item img,.item .emo{width:96px;height:46px}}
#joy{position:absolute;left:max(110px,calc(env(safe-area-inset-left) + 110px));bottom:max(16px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:2px solid rgba(212,175,55,.55);background:rgba(10,10,12,.35);pointer-events:auto;touch-action:none}
#joyK{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(212,175,55,.75);box-shadow:0 2px 8px #000}
#bBreath{left:max(14px,env(safe-area-inset-left)) !important;bottom:max(36px,env(safe-area-inset-bottom)) !important;width:84px !important;height:84px !important}
#bThermal{display:none;right:max(126px,calc(env(safe-area-inset-right) + 126px));bottom:max(108px,calc(env(safe-area-inset-bottom) + 108px));width:58px;height:58px;font-size:12px}
#hud.scoped.hasTh #bThermal{display:flex}#bThermal.on{background:rgba(255,120,40,.6);border-color:#ffb080}
#hud.kc #joy,#hud.kc #bThermal{display:none !important}
@media (max-height:440px){#joy{width:104px;height:104px;left:96px}#bBreath{width:72px !important;height:72px !important}}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mcard{position:relative;text-align:start;background:rgba(20,20,24,.9);border:1px solid rgba(212,175,55,.55);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;min-height:96px}
.mcard .ic{font-size:38px}.mcard b{display:block;color:var(--gold2);font-size:17px}.mcard small{display:block;font-size:12px;opacity:.85;line-height:1.35;margin-top:2px}
.mcard .st{color:var(--gold);letter-spacing:2px;font-size:15px;margin-top:4px}.mcard .num{position:absolute;top:8px;inset-inline-end:10px;color:var(--mut);font-size:12px;font-weight:800}
.mcard.lock{opacity:.5;border-color:#444}.mcard.lock .st{color:var(--mut);letter-spacing:0;font-size:12px}
#zoomBox{right:max(70px,calc(env(safe-area-inset-right) + 70px)) !important}
#zTrack{width:64px !important;height:min(34vh,200px) !important}
#zTrack:before{width:12px !important;border-radius:6px !important}
#zThumb{width:56px !important;height:40px !important;border-radius:12px !important;display:flex;align-items:center;justify-content:center;font-size:14px;color:#16130a;font-weight:900}
#zThumb:after{content:"≡"}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>

<div id="loading" class="on"><h1>SNIPER<span>NEST</span></h1><div class="lb"><div id="loadBar"></div></div><div id="loadTxt" data-t="loading"></div></div>

<section class="screen" id="home">
  <div class="wrap">
    <div class="logo"><h1>SNIPER<span>NEST</span></h1><p data-t="tagline"></p><span class="proto" data-t="proto"></span><br><span class="cash">💰 <span id="cashHome">$0</span></span></div>
    <div class="modes">
      <button class="mode" id="playMissions" data-go="missions"><div class="ic">🗺️</div><div><b data-t="modeMissions"></b><small data-t="modeMissionsD"></small><em id="starsHome"></em></div></button>
      <button class="mode" id="playRange"><div class="ic">🍾</div><div><b data-t="modeRange"></b><small data-t="modeRangeD"></small><em id="bestRange"></em></div></button>
    </div>
    <div class="homebar"><button class="btn solid" data-go="shop">🛒 <span data-t="shop"></span></button><button class="btn" data-go="settings">⚙️ <span data-t="settings"></span></button><button class="btn" data-go="about">ℹ️ <span data-t="about"></span></button></div>
    <div class="badge"><b>AppNest</b> · <span id="ver"></span></div>
  </div>
</section>

<section class="screen" id="settings">
  <div class="head"><button class="bk" data-back><span class="arr">→</span> <span data-t="home"></span></button><h2 data-t="settings"></h2></div>
  <div class="wrap" id="setList"></div>
</section>

<section class="screen" id="missions">
  <div class="head"><button class="bk" data-back><span class="arr">→</span> <span data-t="home"></span></button><h2 data-t="missions"></h2></div>
  <div class="wrap"><div id="misList" class="mgrid"></div></div>
</section>

<section class="screen" id="shop">
  <div class="head"><button class="bk" data-back><span class="arr">→</span> <span data-t="home"></span></button><h2 data-t="shop"></h2><span class="cash" style="margin:0 auto 0 0">💰 <span id="cashShop">$0</span></span></div>
  <div class="wrap"><div id="shopTabs"><button data-tab="rifles" data-t="rifles"></button><button data-tab="mods" data-t="mods"></button></div><div id="shopList"></div><p class="note" data-t="shopHint" style="text-align:center"></p></div>
</section>

<section class="screen" id="about">
  <div class="head"><button class="bk" data-back><span class="arr">→</span> <span data-t="home"></span></button><h2 data-t="about"></h2></div>
  <div class="wrap">
    <div class="aboutLogo"><div>🎯</div><b>SniperNest</b></div>
    <div class="info" id="aboutInfo"></div>
    <div class="links">
      <a href="https://appnest-store.pages.dev" target="_blank" rel="noopener" data-t="store"></a>
      <button id="bShare" data-t="share"></button>
      <a href="mailto:appnest55@gmail.com?subject=SniperNest" data-t="feedback"></a>
      <a href="privacy_policy.html" target="_blank" rel="noopener">🔒 <span data-t="privacy"></span></a>
    </div>
    <p class="disc" data-t="disclaimer"></p>
  </div>
</section>

<div id="hud">
  <div class="top">
    <button class="pill" id="bPause">⏸</button>
    <div class="pill"><span id="tgts"></span></div>
    <div class="pill"><span id="ammo"></span></div>
    <div class="pill"><span class="k" data-t="wind"></span><span id="windV"></span></div>
